<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Z-Index</title>

    <style>
        img {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
        }
    </style>
</head>

<body>
    <h1>This is a heading</h1>

    <img src="anshu photo.jpeg" alt="Background photo">

    <p>
        Because the image has a z-index of -1,
        it will be placed behind the text.
    </p>
</body>
</html>
